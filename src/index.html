<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>IITH Quest</title>
<meta name="description" content="An 8-bit platformer about campus life at IIT Hyderabad. Survive the semester.">
<meta name="theme-color" content="#0b0a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IITH Quest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%238e2343'/%3E%3Crect x='1' y='2' width='6' height='1' fill='%23fff'/%3E%3Crect x='1' y='4' width='6' height='1' fill='%23fff'/%3E%3Crect x='3' y='1' width='2' height='6' fill='%23f2c14e'/%3E%3C/svg%3E">
<style>
/*__STYLES__*/
</style>
</head>
<body class="crt">
<div id="app">
  <div id="screen"><canvas id="game" width="320" height="180"></canvas></div>
  <div id="pad" aria-hidden="true">
    <div id="dpad">
      <button class="btn d up" data-key="up" type="button">&#9650;</button>
      <button class="btn d left" data-key="left" type="button">&#9664;</button>
      <div class="hub"></div>
      <button class="btn d right" data-key="right" type="button">&#9654;</button>
      <button class="btn d down" data-key="down" type="button">&#9660;</button>
    </div>
    <div id="ab">
      <button class="btn rb b" data-key="b" type="button">B</button>
      <button class="btn rb a" data-key="a" type="button">A</button>
    </div>
    <button class="btn" id="startBtn" data-key="start" type="button">START</button>
    <button class="btn" id="fsBtn" type="button" aria-label="Full screen">&#x26F6;</button>
  </div>
  <div id="hint">Arrows / WASD move &middot; Space or Z jump &middot; X or Shift dash &middot; P pause</div>
</div>
<div class="modal" id="nameBox"><div class="card"><label for="nameInput">Your name (for the report card)</label>
  <input id="nameInput" maxlength="10" autocomplete="off" spellcheck="false"><button class="ui" id="nameOk" type="button">OK</button></div></div>
<div class="modal" id="shareBox"><div class="card wide"><img id="shareImg" alt="Your IITH Quest report card"><p id="shareMsg"></p>
  <div class="row"><button class="ui" id="shareBtn" type="button">Share</button><button class="ui" id="saveBtn" type="button">Save image</button>
  <button class="ui ghost" id="copyBtn" type="button">Copy caption</button><button class="ui ghost" id="shareClose" type="button">Close</button></div></div></div>
<script>
/*__GAME_JS__*/
</script>
</body>
</html>
