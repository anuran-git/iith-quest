<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>IITH Quest · Hall of Fame admin</title>
<style>
  body { margin: 0; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; background: #1a1423; color: #f4efe6; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 14px 60px; }
  h1 { font-size: 20px; color: #f2c14e; margin: 0 0 4px; } h2 { font-size: 15px; color: #9fe3f0; margin: 28px 0 8px; }
  p.sub { color: #8a8f98; margin: 0 0 18px; }
  input, button { font: inherit; border-radius: 6px; border: 2px solid #3b3354; padding: 7px 9px; }
  input { background: #f4efe6; color: #1a1423; }
  button { background: #3b3354; color: #f4efe6; cursor: pointer; } button.go { background: #f2c14e; color: #1a1423; border-color: #f2c14e; }
  button.bad { background: #5a1f28; border-color: #b3262e; } button:disabled { opacity: .5; }
  #login { display: flex; gap: 8px; flex-wrap: wrap; } #login input { flex: 1; min-width: 200px; }
  #msg { min-height: 1.4em; margin: 10px 0; color: #9be88a; } #msg.err { color: #ff8a8a; }
  table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 6px 6px; border-bottom: 1px solid #2c2440; vertical-align: middle; }
  th { color: #f2c14e; font-weight: 700; font-size: 12px; } td.n { text-align: right; } td input { width: 9.5em; padding: 5px 7px; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; } .acts button { padding: 4px 8px; font-size: 12px; }
  .muted { color: #8a8f98; } .tag { font-size: 11px; color: #9be88a; }
  @media (max-width: 620px) { th.hide, td.hide { display: none; } }
</style>
</head>
<body>
<main>
  <h1>Hall of Fame admin</h1>
  <p class="sub">Rename players (display name shown instead of the roll number), delete bad scores, or free up a roll number so a player can claim it again on a new device.</p>
  <form id="login"><input id="key" type="password" placeholder="Admin key (ADMIN_KEY in Netlify)" autocomplete="current-password"><button class="go" type="submit">Load board</button></form>
  <div id="msg"></div>
  <div id="out" hidden>
    <h2>Scores</h2>
    <table><thead><tr><th>#</th><th>Roll no.</th><th>Display name</th><th class="n hide">CGPA</th><th class="n">Score</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table>
    <h2>Claimed roll numbers without a score</h2>
    <table><tbody id="claims"></tbody></table>
  </div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id), msg = (t, err) => { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; };
  let key = ''; try { key = sessionStorage.getItem('iithq-admin') || ''; } catch (e) {}
  $('key').value = key;
  async function call(op, extra) {
    const r = await fetch('/api/scores', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.assign({ action: 'admin', key, op }, extra || {})) });
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }
  const el = (tag, props, kids) => { const e = Object.assign(document.createElement(tag), props || {}); (kids || []).forEach(k => e.append(k)); return e; };
  const btn = (label, cls, fn) => el('button', { type: 'button', textContent: label, className: cls || '', onclick: async e => { e.target.disabled = true; try { await fn(); } catch (er) { msg(er.message, true); } e.target.disabled = false; } });
  async function load() {
    const d = await call('list');
    const rows = $('rows'); rows.replaceChildren();
    d.entries.forEach((e, i) => {
      const inp = el('input', { value: e.alias, placeholder: e.roll ? e.roll : e.name, maxLength: 12, disabled: !e.roll });
      const acts = el('div', { className: 'acts' });
      if (e.roll) acts.append(btn('Save name', 'go', async () => { const r = await call('rename', { roll: e.roll, name: inp.value }); inp.value = r.name === e.roll ? '' : r.name; msg(e.roll + ' now shows as ' + r.name); }));
      acts.append(btn('Delete score', 'bad', async () => { if (!confirm('Delete the score for ' + (e.roll || e.name) + '? This cannot be undone.')) return; await call('delete', { id: e.id }); msg('Deleted ' + (e.roll || e.name)); load(); }));
      if (e.claimed) acts.append(btn('Release roll no.', '', async () => { if (!confirm('Release ' + e.roll + '? Its score stays, but any device can claim the number again.')) return; await call('release', { roll: e.roll }); msg('Released ' + e.roll); load(); }));
      rows.append(el('tr', {}, [el('td', { textContent: i + 1 }),
        el('td', {}, [e.roll || el('span', { className: 'muted', textContent: e.name + ' (old)' }), e.claimed ? '' : el('div', { className: 'tag', textContent: e.roll ? 'unclaimed' : '' })]),
        el('td', {}, [inp]), el('td', { className: 'n hide', textContent: Number(e.cgpa).toFixed(2) }), el('td', { className: 'n', textContent: e.score }), el('td', {}, [acts])]));
    });
    if (!d.entries.length) rows.append(el('tr', {}, [el('td', { className: 'muted', colSpan: 6, textContent: 'No scores yet.' })]));
    const cl = $('claims'); cl.replaceChildren();
    d.unscored.forEach(c => cl.append(el('tr', {}, [el('td', { textContent: c.roll }), el('td', { className: 'muted', textContent: c.alias || '' }),
      el('td', {}, [btn('Release roll no.', '', async () => { await call('release', { roll: c.roll }); msg('Released ' + c.roll); load(); })])])));
    if (!d.unscored.length) cl.append(el('tr', {}, [el('td', { className: 'muted', textContent: 'None.' })]));
    $('out').hidden = false;
  }
  $('login').onsubmit = async e => {
    e.preventDefault(); key = $('key').value.trim(); msg('Loading...');
    try { await load(); msg('Signed in. Changes show in the game right away.'); try { sessionStorage.setItem('iithq-admin', key); } catch (er) {} }
    catch (er) { $('out').hidden = true; msg(er.message === 'Failed to fetch' ? 'Could not reach /api/scores. Is the site deployed with functions (CLI or GitHub)?' : er.message, true); }
  };
})();
</script>
</body>
</html>
