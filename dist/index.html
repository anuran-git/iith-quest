// ── CATCH: move left/right, catch good cards, avoid bad ones ──
function CatchGame(cfg, env) {
  const total = cfg.secs * 60;
  let t = 0, px = W / 2 - 8, face = 1, moving = false, items = [], next = 40, caught = 0, goodTotal = 0, badHits = 0, flash = 0;
  const g = {
    done: false, score: 0,
    update() {
      t++; if (flash > 0) flash--;
      let ax = (Input.down.right ? 1 : 0) - (Input.down.left ? 1 : 0);
      px = clamp(px + ax * 2.8, 4, W - 20); if (ax) face = ax; moving = !!ax;
      if (t < total && --next <= 0) {
        const prog = t / total, good = Math.random() < 0.7, label = good ? pick(cfg.good) : cfg.bad, w = Font.width(label) + 8;
        items.push({ x: rand(6, W - w - 6), y: -12, w, vy: 1 + prog * 1.0 + rand(0, 0.3), good, label });
        if (good) goodTotal++; next = Math.round(lerp(44, 22, prog));
      }
      items = items.filter(it => {
        it.y += it.vy;
        if (it.y + 11 > 128 && it.y < 150 && it.x < px + 18 && it.x + it.w > px - 2) {
          if (it.good) { caught++; Sound.sfx('coin'); } else { badHits++; flash = 14; Sound.sfx('bad'); }
          return false;
        }
        return it.y < H;
      });
      if (t >= total && !items.length) { g.done = true; g.score = clamp(caught / Math.max(1, goodTotal) - badHits * 0.08, 0, 1); }
    },
    draw(ctx) {
      ctx.fillStyle = '#8fa7ab'; ctx.fillRect(0, 150, W, 30); ctx.fillStyle = '#c6d6d6'; ctx.fillRect(0, 150, W, 2);
      ctx.fillStyle = '#7b9297'; for (let x = 7; x < W; x += 16) ctx.fillRect(x, 152, 1, 28);
      items.forEach(it => {
        ctx.fillStyle = C.ink; ctx.fillRect(Math.round(it.x), Math.round(it.y), it.w, 11);
        ctx.fillStyle = it.good ? '#fff3c4' : '#d33c3c'; ctx.fillRect(Math.round(it.x) + 1, Math.round(it.y) + 1, it.w - 2, 9);
        Font.draw(ctx, it.label, it.x + 4, it.y + 2, it.good ? C.ink : '#fff3c4');
      });
      let img = moving ? env.sprites.run[(t >> 2) % 4] : env.sprites.idle; if (face < 0) img = Art.flip(img);
      if (!(flash > 0 && (flash >> 1) % 2)) ctx.drawImage(img, Math.round(px), 126);
      timeBar(ctx, 1 - t / total);
      Font.draw(ctx, 'CAUGHT ' + caught, 8, 8, '#fff3c4', { shadow: C.ink });
      if (badHits) Font.draw(ctx, cfg.bad + ' X' + badHits, W - 8, 8, '#ff8a8a', { align: 'right', shadow: C.ink });
    },
  };
  return g;
}

// ── QUIZ: multiple choice against a timer ──
function QuizGame(cfg) {
  const used = {};
  const qs = cfg.cats.map(cat => {
    used[cat] = used[cat] || shuffle(QUESTIONS[cat]);
    const raw = used[cat].pop(), opts = shuffle(raw.slice(1));
    return { q: raw[0], opts, ans: opts.indexOf(raw[1]), cat };
  });
  const per = cfg.secs * 60;
  let qi = 0, sel = 0, t = per, phase = 'ask', pt = 0, correct = 0, picked = -1;
  const rowY = i => 80 + i * 22;
  function answer(i) { picked = i; phase = 'show'; pt = 0; if (i === qs[qi].ans) { correct++; Sound.sfx('good'); } else Sound.sfx('bad'); }
  const g = {
    done: false, score: 0,
    update() {
      if (phase === 'ask') {
        t--;
        if (Input.pressed.up) { sel = (sel + 3) % 4; Sound.sfx('select'); }
        if (Input.pressed.down) { sel = (sel + 1) % 4; Sound.sfx('select'); }
        for (let i = 0; i < 4; i++) if (Input.tapIn(30, rowY(i), 260, 19)) { sel = i; answer(i); return; }
        if (Input.confirm()) answer(sel); else if (t <= 0) answer(-1);
      } else if (++pt > 75) {
        if (++qi >= qs.length) { g.done = true; g.score = correct / qs.length; }
        else { phase = 'ask'; t = per; sel = 0; picked = -1; }
      }
    },
    draw(ctx) {
      const q = qs[Math.min(qi, qs.length - 1)];
      Font.draw(ctx, 'QUESTION ' + (Math.min(qi, qs.length - 1) + 1) + '/' + qs.length, 8, 8, '#fff3c4', { shadow: C.ink });
      Font.draw(ctx, 'RIGHT: ' + correct, W - 8, 8, '#9be88a', { align: 'right', shadow: C.ink });
      timeBar(ctx, t / per);
      panel(ctx, 20, 32, 280, 42);
      const lines = Font.wrap(q.q, 44); lines.forEach((l, i) => Font.draw(ctx, l, W / 2, 53 - lines.length * 4.5 + i * 9 - 0, C.white, { align: 'center' }));
      q.opts.forEach((o, i) => {
        let fill = '#2c2440', edge = '#6b6480', col = C.white;
        if (phase === 'ask' && i === sel) { fill = '#47196b'; edge = '#f2c14e'; }
        if (phase === 'show') { if (i === q.ans) { fill = '#2f6b3a'; edge = '#9be88a'; } else if (i === picked) { fill = '#7d1a25'; edge = '#ff8a8a'; } else col = '#8a8f98'; }
        panel(ctx, 30, rowY(i), 260, 19, fill, edge);
        Font.draw(ctx, 'ABCD'[i] + '.', 38, rowY(i) + 6, '#f2c14e'); Font.draw(ctx, o, 54, rowY(i) + 6, col);
      });
      if (phase === 'show') Font.draw(ctx, picked === q.ans ? 'CORRECT!' : picked < 0 ? 'TIME UP!' : 'NOT QUITE...', W / 2, 169, picked === q.ans ? '#9be88a' : '#ff8a8a', { align: 'center', shadow: C.ink });
    },
  };
  return g;
}

// ── MASH: hammer A to fill the bar, B closes pop-up distractions ──
function MashGame(cfg) {
  const total = cfg.secs * 60, POPS = ['MEME FROM ROOMMATE', 'MESS MENU: BIRYANI!', 'GROUP CHAT: 99+ NEW', 'WIFI RECONNECTING...', 'NEW REEL FOR YOU', 'UPDATE AND RESTART?'];
  let t = 0, prog = 0, popup = null, nextPop = rand(160, 240), endT = 0, bump = 0;
  const g = {
    done: false, score: 0,
    update() {
      if (endT) { if (++endT > 70) g.done = true; return; }
      t++; if (bump > 0) bump--;
      if (popup) {
        if (Input.pressed.b || Input.tapIn(popup.x, popup.y, 150, 40)) { popup = null; nextPop = rand(150, 280); Sound.sfx('select'); }
        else if (Input.pressed.a) Sound.sfx('bad');
      } else {
        if (Input.pressed.a || Input.tap) { prog += 1.9; bump = 3; Sound.sfx('type'); }
        prog = Math.max(0, prog - 0.022);
        if (--nextPop <= 0) { popup = { text: pick(POPS), x: randi(30, 140), y: randi(52, 96) }; Sound.sfx('bad'); }
      }
      if (prog >= 100) { prog = 100; endT = 1; g.score = 0.6 + 0.4 * clamp((total - t) / (total * 0.5), 0, 1); Sound.sfx('win'); }
      else if (t >= total) { endT = 1; g.score = prog / 100 * 0.6; Sound.sfx('lose'); }
    },
    draw(ctx) {
      panel(ctx, 30, 30, 260, 118, '#f4efe6', '#3a3f55');
      ctx.fillStyle = '#3b5d8f'; ctx.fillRect(32, 32, 256, 11); Font.draw(ctx, 'REPORT_FINAL_V7.DOC', 37, 34, C.white);
      const rows = Math.floor(prog / 100 * 54);   // "typed" lines
      ctx.fillStyle = '#565b66';
      for (let i = 0; i < rows; i++) { const r = i % 9, c = Math.floor(i / 9); ctx.fillRect(40 + c * 41, 50 + r * 8, 22 + ((i * 7) % 13), 3); }
      ctx.fillStyle = C.ink; ctx.fillRect(40, 128, 240, 12); ctx.fillStyle = '#9be88a'; ctx.fillRect(41, 129 + (bump ? 1 : 0), Math.round(238 * prog / 100), 10);
      Font.draw(ctx, Math.floor(prog) + '%', W / 2, 131, prog > 50 ? C.ink : C.white, { align: 'center' });
      const secs = Math.max(0, Math.ceil((total - t) / 60));
      Font.draw(ctx, '11:59 PM IN ' + secs + 'S', 8, 8, secs < 8 ? '#ff8a8a' : '#fff3c4', { shadow: C.ink });
      timeBar(ctx, 1 - t / total);
      if (popup) {
        panel(ctx, popup.x, popup.y, 150, 40, '#fff3c4', '#d33c3c');
        Font.draw(ctx, popup.text, popup.x + 75, popup.y + 8, C.ink, { align: 'center' });
        Font.draw(ctx, 'PRESS B TO CLOSE', popup.x + 75, popup.y + 24, '#b3262e', { align: 'center' });
      } else if (!endT && (t >> 3) % 2) Font.draw(ctx, 'MASH A!', W / 2, 158, '#f2c14e', { align: 'center', scale: 2, shadow: C.ink });
      if (endT) Font.draw(ctx, prog >= 100 ? 'SUBMITTED!' : 'PORTAL CLOSED!', W / 2, 156, prog >= 100 ? '#9be88a' : '#ff8a8a', { align: 'center', scale: 2, shadow: C.ink });
    },
  };
  return g;
}

// ── RHYTHM: four lanes (← → A B), hit notes on the line ──
function RhythmGame(cfg, env) {
  const LANES = [{ key: 'left', label: '←', col: '#e05a8a' }, { key: 'right', label: '→', col: '#7fe0e8' }, { key: 'a', label: 'A', col: '#f2c14e' }, { key: 'b', label: 'B', col: '#9be88a' }];
  const LX = i => 172 + i * 34, HIT = 140, SPEED = 1.5;
  const notes = []; let tt = 150, last = -1;
  for (let i = 0; i < cfg.notes; i++) {
    let lane = randi(0, 3); if (lane === last && Math.random() < 0.6) lane = (lane + randi(1, 3)) % 4; last = lane;
    notes.push({ t: tt, lane, hit: 0 }); tt += (i > cfg.notes * 0.45 && i % 4 !== 3) ? 15 : 30;
  }
  let t = 0, perfect = 0, good = 0, combo = 0, verdict = '', vt = 0, press = [0, 0, 0, 0];
  const g = {
    done: false, score: 0,
    update() {
      t++; if (vt > 0) vt--;
      LANES.forEach((ln, i) => {
        if (press[i] > 0) press[i]--;
        if (!(Input.pressed[ln.key] || Input.tapIn(LX(i) - 2, 20, 34, 160))) return;
        press[i] = 6;
        let best = null; notes.forEach(n => { if (!n.hit && n.lane === i && Math.abs(n.t - t) <= 11 && (!best || Math.abs(n.t - t) < Math.abs(best.t - t))) best = n; });
        if (best) { const d = Math.abs(best.t - t); best.hit = 1; combo++; if (d <= 4) { perfect++; verdict = 'PERFECT!'; Sound.sfx('perfect'); } else { good++; verdict = 'GOOD'; Sound.sfx('good'); } vt = 24; }
      });
      notes.forEach(n => { if (!n.hit && t - n.t > 11) { n.hit = -1; combo = 0; verdict = 'MISS'; vt = 24; } });
      if (t > tt + 60) { g.done = true; g.score = (perfect + good * 0.65) / notes.length; }
    },
    draw(ctx) {
      // stage + dancer
      ctx.fillStyle = '#2a2233'; ctx.fillRect(10, 126, 140, 40); ctx.fillStyle = '#47196b'; ctx.fillRect(10, 126, 140, 3);
      const beat = (t % 30) < 15;
      [['#e05a8a', 30], ['#7fe0e8', 80], ['#f2c14e', 130]].forEach((l, i) => { ctx.globalAlpha = 0.18 + (((t / 30 | 0) + i) % 3 === 0 ? 0.18 : 0); ctx.fillStyle = l[0]; ctx.beginPath(); ctx.moveTo(l[1], 20); ctx.lineTo(l[1] + 26, 126); ctx.lineTo(l[1] - 26, 126); ctx.fill(); });
      ctx.globalAlpha = 1;
      let img = combo > 0 ? env.sprites.run[(t / 15 | 0) % 4] : env.sprites.idle; if ((t / 60 | 0) % 2) img = Art.flip(img);
      ctx.drawImage(img, 0, 0, 16, 24, 56, 78 - (beat && combo > 0 ? 3 : 0), 32, 48);
      for (let i = 0; i < 9; i++) { ctx.fillStyle = i % 2 ? '#1a1423' : '#2c2440'; World.disc(ctx, 14 + i * 16, 172 - ((i + (beat ? 1 : 0)) % 2) * 2, 7, ctx.fillStyle); }
      Font.draw(ctx, 'COMBO ' + combo, 80, 30, '#fff3c4', { align: 'center', shadow: C.ink });
      if (vt > 0) Font.draw(ctx, verdict, 80, 46, verdict === 'MISS' ? '#ff8a8a' : '#9be88a', { align: 'center', scale: 2, shadow: C.ink });
      // lanes
      LANES.forEach((ln, i) => {
        ctx.fillStyle = 'rgba(11,10,18,0.6)'; ctx.fillRect(LX(i), 18, 30, 162);
        ctx.fillStyle = press[i] ? ln.col : '#4a3f55'; ctx.fillRect(LX(i), HIT - 2, 30, 14); ctx.fillStyle = C.ink; ctx.fillRect(LX(i) + 1, HIT - 1, 28, 12);
        Font.draw(ctx, ln.label, LX(i) + 15, HIT + 2, press[i] ? C.white : ln.col, { align: 'center' });
      });
      notes.forEach(n => {
        if (n.hit === 1) return; const y = HIT - (n.t - t) * SPEED; if (y < 12 || y > H) return;
        const ln = LANES[n.lane]; ctx.globalAlpha = n.hit === -1 ? 0.3 : 1;
        ctx.fillStyle = C.ink; ctx.fillRect(LX(n.lane) + 3, y - 1, 24, 12); ctx.fillStyle = ln.col; ctx.fillRect(LX(n.lane) + 4, y, 22, 10);
        Font.draw(ctx, ln.label, LX(n.lane) + 15, y + 2, C.ink, { align: 'center' }); ctx.globalAlpha = 1;
      });
      timeBar(ctx, 1 - t / (tt + 60), 8);
    },
  };
  return g;
}

// ── TIMING: stop the marker in the green zone, once per slide ──
function TimingGame(cfg, env) {
  const X0 = 50, X1 = 270, REACT = { 1: ['NICE!', 'LOVELY', 'CLEAR!'], 0.7: ['GOOD', 'OKAY', 'GO ON'], 0.3: ['HMM...', 'LOUDER?', 'WHY?'], 0: ['...', 'NEXT.', 'OH NO'] };
  const jury = [Art.player('boy', 'formal', { H: '#8a8f98', M: '#5a6a8a', m: '#44506a' }), Art.player('girl', 'formal', { H: '#2a2233', M: '#8e2c4a', m: '#74203a' }), Art.player('boy', 'formal', { H: '#4a2618', M: '#3a6a5a', m: '#2a5044' })];
  let round = 0, t = 0, phase = 'aim', pt = 0, sum = 0, last = 0, zc, zw, speed, pos = X0, dir = 1, bubble = [];
  function setRound() { const k = round / Math.max(1, cfg.rounds - 1); zw = lerp(46, 20, k); speed = lerp(2.2, 4.2, k); zc = rand(X0 + 40, X1 - 40); pos = X0; dir = 1; t = 0; }
  setRound();
  function judge(v) { last = v; sum += v; phase = 'show'; pt = 0; bubble = REACT[v]; Sound.sfx(v === 1 ? 'perfect' : v >= 0.7 ? 'good' : v > 0 ? 'select' : 'bad'); }
  const g = {
    done: false, score: 0,
    update() {
      if (phase === 'aim') {
        t++; pos += dir * speed; if (pos > X1) { pos = X1; dir = -1; } if (pos < X0) { pos = X0; dir = 1; }
        if (Input.pressed.a || Input.tap) { const d = Math.abs(pos - zc); judge(d <= zw * 0.2 ? 1 : d <= zw / 2 ? 0.7 : d <= zw * 0.9 ? 0.3 : 0); }
        else if (t > 420) judge(0);
      } else if (++pt > 70) {
        if (++round >= cfg.rounds) { g.done = true; g.score = sum / cfg.rounds; } else { phase = 'aim'; setRound(); }
      }
    },
    draw(ctx) {
      const r = Math.min(round, cfg.rounds - 1);
      // projected slide
      panel(ctx, 104, 24, 166, 60, '#f4efe6', '#3a3f55');
      Font.draw(ctx, 'SLIDE ' + (r + 1) + '/' + cfg.rounds, 187, 31, '#8a8f98', { align: 'center' });
      Font.draw(ctx, cfg.labels[r] || 'SLIDE', 187, 46, C.ink, { align: 'center', scale: cfg.labels[r] && cfg.labels[r].length > 12 ? 1 : 2 });
      ctx.fillStyle = '#b3262e'; ctx.fillRect(127, 68, 120, 3); ctx.fillStyle = '#c9c2b4'; ctx.fillRect(127, 74, 80, 2);
      // jury (seated, facing the presenter) and the presenter
      jury.forEach((j, i) => big(ctx, j.idle, 4 + i * 28, 70, 2));
      ctx.fillStyle = '#5a4630'; ctx.fillRect(2, 104, 96, 16); ctx.fillStyle = '#8a5a34'; ctx.fillRect(2, 104, 96, 3);
      big(ctx, Art.flip(env.sprites.idle), 280, 72, 2);
      if (phase === 'show') bubble.forEach((b, i) => { if (pt > i * 10) Font.draw(ctx, b, 20 + i * 28, 58 - i % 2 * 9, last >= 0.7 ? '#9be88a' : last > 0 ? '#fff3c4' : '#ff8a8a', { align: 'center', shadow: C.ink }); });
      // meter
      ctx.fillStyle = C.ink; ctx.fillRect(X0 - 3, 136, X1 - X0 + 6, 18); ctx.fillStyle = '#4a3f55'; ctx.fillRect(X0 - 2, 137, X1 - X0 + 4, 16);
      ctx.fillStyle = '#c9962e'; ctx.fillRect(zc - zw * 0.9, 137, zw * 1.8, 16);
      ctx.fillStyle = '#6fbf4a'; ctx.fillRect(zc - zw / 2, 137, zw, 16); ctx.fillStyle = '#c8f5a8'; ctx.fillRect(zc - zw * 0.2, 137, zw * 0.4, 16);
      ctx.fillStyle = C.ink; ctx.fillRect(Math.round(pos) - 2, 132, 5, 26); ctx.fillStyle = C.white; ctx.fillRect(Math.round(pos) - 1, 133, 3, 24);
      Font.draw(ctx, 'CONFIDENCE', W / 2, 124, '#fff3c4', { align: 'center', shadow: C.ink });
      if (phase === 'show') Font.draw(ctx, last === 1 ? 'PERFECT!' : last >= 0.7 ? 'GOOD!' : last > 0 ? 'SHAKY...' : 'MISSED!', W / 2, 162, last >= 0.7 ? '#9be88a' : last > 0 ? '#fff3c4' : '#ff8a8a', { align: 'center', scale: 2, shadow: C.ink });
      else if ((t >> 4) % 2) Font.draw(ctx, 'PRESS A', W / 2, 164, '#f2c14e', { align: 'center', shadow: C.ink });
      Font.draw(ctx, 'SCORE ' + Math.round(sum / cfg.rounds * 100) + '%', 8, 8, '#fff3c4', { shadow: C.ink });
    },
  };
  return g;
}

// Runs several mini-games back to back; score is their average.
function SequenceGame(parts) {
  let i = 0, sum = 0;
  const g = {
    done: false, score: 0,
    update() { const cur = parts[i]; cur.update(); if (cur.done) { sum += cur.score; if (++i >= parts.length) { g.done = true; g.score = sum / parts.length; i = parts.length - 1; } } },
    draw(ctx) { parts[i].draw(ctx); },
  };
  return g;
}

const MINIGAMES = {
  catch: CatchGame, quiz: QuizGame, mash: MashGame, rhythm: RhythmGame, timing: TimingGame,
  interview: (cfg, env) => SequenceGame([TimingGame(cfg, env), QuizGame(cfg)]),
};

// Boss round wrapper: briefing → mini-game → verdict (retry if below PASS).
function BossScene(run) {
  const L = LEVELS[run.level], cfg = L.boss, PASS = 0.35;
  const env = { sprites: Art.player(Save.data.char, L.outfit) };
  let phase = 'intro', t = 0, game = null, menu = null;
  function start() { game = MINIGAMES[cfg.type](cfg, env); phase = 'play'; t = 0; Sound.music(cfg.type === 'rhythm' ? 'fest' : 'boss'); }
  function finish(score) { run.boss = score; Game.go(ResultScene(run)); }
  return {
    update() {
      t++;
      if (phase === 'intro') { if (t > 20 && (Input.confirm() || Input.tap)) { Sound.sfx('confirm'); start(); } }
      else if (phase === 'play') {
        game.update();
        if (game.done) {
          phase = 'outro'; t = 0; Sound.stopMusic();
          const ok = game.score >= PASS; Sound.sfx(ok ? 'win' : 'lose');
          menu = ok ? Menu([{ label: 'CONTINUE', fn: () => finish(game.score) }])
            : Menu([{ label: 'TRY AGAIN', fn: () => { run.bossRetries++; start(); } }].concat(run.bossRetries >= 1 ? [{ label: 'TAKE GRACE MARKS', fn: () => finish(PASS) }] : []));
        }
      } else if (t > 30) menu.update();
    },
    draw(ctx) {
      World.drawBackground(ctx, L.theme, 40, t); ctx.fillStyle = 'rgba(11,10,18,0.6)'; ctx.fillRect(0, 0, W, H);
      if (phase === 'intro') {
        Font.draw(ctx, 'BOSS ROUND', W / 2, 26, '#ff8a8a', { align: 'center', shadow: C.ink });
        Font.draw(ctx, cfg.title, W / 2, 44, '#fff3c4', { align: 'center', scale: cfg.title.length > 15 ? 2 : 3, shadow: C.ink });
        panel(ctx, 30, 84, 260, 50);
        const lines = Font.wrap(cfg.how, 40); lines.forEach((l, i) => Font.draw(ctx, l, W / 2, 109 - lines.length * 4.5 + i * 9, C.white, { align: 'center' }));
        if ((t >> 4) % 2) Font.draw(ctx, 'PRESS A / TAP TO START', W / 2, 150, '#f2c14e', { align: 'center', shadow: C.ink });
      } else if (phase === 'play') game.draw(ctx);
      else {
        const ok = game.score >= PASS;
        Font.draw(ctx, cfg.title, W / 2, 30, '#cfd6e6', { align: 'center', shadow: C.ink });
        Font.draw(ctx, Math.round(game.score * 100) + '%', W / 2, 52, ok ? '#9be88a' : '#ff8a8a', { align: 'center', scale: 4, shadow: C.ink });
        Font.draw(ctx, ok ? (game.score > 0.85 ? 'OUTSTANDING!' : game.score > 0.6 ? 'WELL DONE!' : 'YOU SCRAPED THROUGH') : 'NOT ENOUGH TO PASS', W / 2, 96, '#fff3c4', { align: 'center', shadow: C.ink });
        if (t > 30) menu.draw(ctx, W / 2, 122);
      }
    },
  };
}

// 09-scenes.js — menus and story screens. A scene is { update(), draw(ctx) };
// switch with Game.go(SomeScene()). Flow:

// Vertical menu. items: [{ label: 'TEXT' | () => 'TEXT', fn }]. Works with
// up/down + A/Enter and with direct taps.
function Menu(items) {
  const m = {
    sel: 0, items, rects: [],
    update() {
      const n = items.length;
      if (Input.pressed.up) { m.sel = (m.sel + n - 1) % n; Sound.sfx('select'); }
      if (Input.pressed.down) { m.sel = (m.sel + 1) % n; Sound.sfx('select'); }
      for (let i = 0; i < m.rects.length; i++) { const r = m.rects[i]; if (r && Input.tapIn(r[0], r[1], r[2], r[3])) { m.sel = i; Sound.sfx('confirm'); items[i].fn(); return; } }
      if (Input.confirm()) { Sound.sfx('confirm'); items[m.sel].fn(); }
    },
    draw(ctx, cx, y, gap = 14) {
      items.forEach((it, i) => {
        const label = typeof it.label === 'function' ? it.label() : it.label, w = Font.width(label), on = i === m.sel;
        if (on) { ctx.fillStyle = 'rgba(242,193,78,0.18)'; ctx.fillRect(cx - w / 2 - 13, y + i * gap - 3, w + 26, 13); Font.draw(ctx, '>', cx - w / 2 - 10, y + i * gap, '#f2c14e'); }
        Font.draw(ctx, label, cx, y + i * gap, on ? '#f2c14e' : C.white, { align: 'center', shadow: C.ink });
        m.rects[i] = [cx - 75, y + i * gap - 3, 150, gap];
      });
    },
  };
  return m;
}

// Scrolling campus backdrop used behind menus

  if (dim) { ctx.fillStyle = 'rgba(11,10,18,' + dim + ')'; ctx.fillRect(0, 0, W, H); }
}
function big(ctx, img, x, y, s) { ctx.drawImage(img, 0, 0, img.width, img.height, x, y, img.width * s, img.height * s); }

function TitleScene() {

// Keyboard remapping. Rows = actions (2 key slots each) + options. A/Enter on a slot → press the new key.
// Esc cancels, Delete clears a second slot. Taking a key already in use swaps the two bindings.
function ControlsScene() {
  let t = 0, row = 0, col = 0, waiting = false, msg = '';
  const acts = Input.ACTIONS, extra = ['UP ALSO JUMPS', 'RESET TO DEFAULTS', 'BACK'], N = acts.length + extra.length;
  const keys = () => { const k = {}; for (const a of acts) k[a.id] = Input.bindings[a.id].slice(); return k; };
  const rectOf = (r, c) => c < 0 ? [60, 34 + r * 12 - 2, 200, 11] : [c ? 214 : 134, 34 + r * 12 - 2, 72, 11];
  function assign(r, c, code) {
    const k = keys(), a = acts[r].id, old = k[a][c];
    if (code === 'Delete') { if (c === 1 || k[a][1]) { if (c === 0) { k[a][0] = k[a][1]; } k[a][c === 0 ? 1 : c] = null; msg = 'CLEARED'; } else { msg = 'EACH ACTION NEEDS A KEY'; return; } }
    else if (code === 'Enter' || code === 'NumpadEnter') { msg = 'ENTER IS RESERVED FOR MENUS'; return; }
    else {
      for (const b of acts) for (let j = 0; j < 2; j++) if (k[b.id][j] === code && !(b.id === a && j === c)) {
        k[b.id][j] = old; msg = Input.keyName(code) + ' SWAPPED WITH ' + b.label;
        if (!k[b.id][0]) { k[b.id][0] = k[b.id][1]; k[b.id][1] = null; }
      }
      k[a][c] = code; if (!msg) msg = acts[r].label + ' = ' + Input.keyName(code);
    }
    Save.setKeys(k); Sound.sfx('confirm');
  }
  function activate() {
    msg = '';
    if (row < acts.length) { waiting = true; Sound.sfx('select'); Input.captureNext(code => { waiting = false; if (code) assign(row, col, code); else { msg = 'CANCELLED'; Sound.sfx('back'); } }); }
    else if (row === acts.length) { Save.toggle('upJumps'); Sound.sfx('confirm'); }
    else if (row === acts.length + 1) { Save.data.opts.upJumps = true; Save.setKeys(null); msg = 'DEFAULTS RESTORED'; Sound.sfx('confirm'); }
    else { Sound.sfx('back'); Game.go(OptionsScene()); }
  }
  return {
    update() {
      t++; if (waiting) return;
      if (Input.pressed.up) { row = (row + N - 1) % N; Sound.sfx('select'); }
      if (Input.pressed.down) { row = (row + 1) % N; Sound.sfx('select'); }
      if (row < acts.length && (Input.pressed.left || Input.pressed.right)) { col ^= 1; Sound.sfx('select'); }
      for (let r = 0; r < N; r++) for (const c of r < acts.length ? [0, 1] : [-1]) { const q = rectOf(r, c); if (Input.tapIn(q[0], q[1], q[2], q[3])) { row = r; col = Math.max(0, c); activate(); return; } }
      if (Input.pressed.back) { Sound.sfx('back'); Game.go(OptionsScene()); return; }
      if (t > 8 && Input.confirm()) activate();
    },
    draw(ctx) {
      drawBackdrop(ctx, 'night', t, 0.7);
      Font.draw(ctx, 'KEYBOARD CONTROLS', W / 2, 8, '#fff3c4', { align: 'center', scale: 2, shadow: C.ink });
      Font.draw(ctx, 'KEY 1', 170, 24, '#f2c14e', { align: 'center' }); Font.draw(ctx, 'KEY 2', 250, 24, '#f2c14e', { align: 'center' });
      acts.forEach((a, r) => {
        const y = 34 + r * 12; Font.draw(ctx, a.label, 64, y, row === r ? '#f2c14e' : '#9fe3f0');
        for (let c = 0; c < 2; c++) {
          const q = rectOf(r, c), on = row === r && col === c;
          ctx.fillStyle = on ? (waiting ? '#7d1a25' : 'rgba(242,193,78,0.25)') : 'rgba(255,255,255,0.06)'; ctx.fillRect(q[0], q[1], q[2], q[3]);
          const label = on && waiting ? ((t >> 4) % 2 ? 'PRESS KEY' : '') : Input.keyName(Input.bindings[a.id][c]);
          Font.draw(ctx, label, q[0] + 36, y, on ? '#fff3c4' : C.white, { align: 'center' });
        }
      });
      extra.forEach((e, i) => {
        const r = acts.length + i, y = 34 + r * 12 + 4, on = row === r;
        const label = i === 0 ? e + ': ' + (Input.upJumps ? 'ON' : 'OFF') : e;
        if (on) { ctx.fillStyle = 'rgba(242,193,78,0.18)'; ctx.fillRect(60, y - 3, 200, 11); }
        Font.draw(ctx, label, W / 2, y, on ? '#f2c14e' : C.white, { align: 'center' });
      });
      Font.draw(ctx, waiting ? 'PRESS THE NEW KEY  -  ESC TO CANCEL' : (msg || '← → PICK SLOT   ENTER CHANGE   DEL CLEAR'), W / 2, 170, waiting ? '#fff3c4' : msg ? '#9be88a' : '#8a8f98', { align: 'center' });
    },
  };
}

// ─────────────────────────────────────────────────────────────────────────────
// 10-save.js — progress (localStorage), grading, the scoreboard adapter and
// the share card.
// ─────────────────────────────────────────────────────────────────────────────

// Turns a finished run into a percentage, letter grade and score.
//   run = { level, credits, totalCredits, timeLeft, totalTime, retries, boss (0..1), bossRetries }
function scoreRun(run) {
  const creditRatio = run.totalCredits ? Math.min(1, run.credits / run.totalCredits) : 1;
  const timeRatio = clamp(run.timeLeft / (run.totalTime * 0.5), 0, 1);       // full marks with half the time left
  const pct = clamp(Math.round(100 * (0.45 * creditRatio + 0.2 * timeRatio + 0.35 * run.boss) - 7 * run.retries - 5 * run.bossRetries), 0, 100);
  const gr = gradeFor(pct);
  const score = Math.max(0, run.credits * 100 + Math.round(run.timeLeft / 60) * 10 + Math.round(run.boss * 2000) - run.retries * 300 - run.bossRetries * 200);
  return { pct, grade: gr.g, pts: gr.p, score };
}

const Save = (() => {
  const fresh = () => ({ v: 1, char: 'boy', name: '', unlocked: 0, levels: {}, opts: { music: true, sfx: true, crt: true, upJumps: true }, keys: null });
  let data = fresh();
  function apply() { Sound.setOpts({ music: data.opts.music, sfx: data.opts.sfx }); document.body.classList.toggle('crt', !!data.opts.crt);
    Input.setBindings(data.keys, data.opts.upJumps !== false); if (typeof Game !== 'undefined' && Game.updateHint) Game.updateHint(); }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (d && d.v === 1) data = Object.assign(fresh(), d, { opts: Object.assign(fresh().opts, d.opts) });
    } catch (e) { /* storage unavailable: play without saving */ }
    apply();
  }
  function store() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {} }
  function toggle(k) { data.opts[k] = !data.opts[k]; apply(); store(); }
  function setKeys(keys) { data.keys = keys; apply(); store(); }
  function reset() { data = Object.assign(fresh(), { opts: data.opts, keys: data.keys, char: data.char, name: data.name }); store(); }
  function record(run) {
    const r = scoreRun(run), prev = data.levels[run.level];
    r.best = !prev || r.score > prev.score;
    if (r.best) data.levels[run.level] = { grade: r.grade, pts: r.pts, pct: r.pct, score: r.score };
    data.unlocked = Math.max(data.unlocked, run.level + 1);
    store(); return r;
  }
  function cgpa() { const v = Object.values(data.levels); return v.length ? v.reduce((s, l) => s + l.pts, 0) / v.length : 0; }
  function totalScore() { return Object.values(data.levels).reduce((s, l) => s + l.score, 0); }
  const hasProgress = () => data.unlocked > 0;
  return { get data() { return data; }, load, store, toggle, setKeys, reset, record, cgpa, totalScore, hasProgress };
})();

// ── Scoreboard ──────────────────────────────────────────────────────────────
// The game only talks to Leaderboard.top(n) and Leaderboard.submit(entry).
//   entry = { name, char, cgpa, score, offer, date }
// RemoteBoard = global Hall of Fame (Netlify Function at /api/scores, see netlify/functions/scores.mjs).
// LocalBoard  = this device only; used as fallback when offline or when the game runs outside Netlify.
const LocalBoard = {
  read() { try { return JSON.parse(localStorage.getItem(BOARD_KEY) || '[]') || []; } catch (e) { return []; } },
  async top(n) { return this.read().slice(0, n); },
  async submit(entry) {
    let list = this.read().filter(e => !(e.name === entry.name && e.score <= entry.score));   // keep each name's best
    if (!list.some(e => e.name === entry.name)) list.push(entry);
    list.sort((a, b) => b.score - a.score);
    try { localStorage.setItem(BOARD_KEY, JSON.stringify(list.slice(0, 20))); } catch (e) {}
  },
};
const BOARD_URL = '/api/scores', PENDING_KEY = 'iith-quest-pending-v1';
const RemoteBoard = {
  available: /^https?:$/.test(location.protocol) && !/claude\.ai|claudeusercontent|localhost|127\.0\.0\.1/.test(location.hostname),
  async call(opts) {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 7000);
    try { const r = await fetch(BOARD_URL + (opts ? '' : '?limit=20'), Object.assign({ signal: ctl.signal, headers: { 'content-type': 'application/json' } }, opts || {}));
      if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
    finally { clearTimeout(to); }
  },
  async top(n) { return ((await this.call()).entries || []).slice(0, n); },
  async submit(entry) { return this.call({ method: 'POST', body: JSON.stringify(entry) }); },
};
const Leaderboard = {
  note: '', global: false, rank: 0,
  async top(n) {
    if (RemoteBoard.available) {
      try {
        await this.flush();
        const list = await RemoteBoard.top(n); this.global = true;
        this.note = 'GLOBAL HALL OF FAME  -  ALL PLAYERS'; return list;
      } catch (e) { this.note = 'OFFLINE  -  SHOWING SCORES ON THIS DEVICE'; }
    } else this.note = 'SCORES ON THIS DEVICE (GLOBAL BOARD WORKS ONCE HOSTED)';
    this.global = false; return LocalBoard.top(n).catch(() => []);
  },
  async submit(entry) {
    await LocalBoard.submit(entry).catch(() => {});
    if (!RemoteBoard.available) return;
    try { const r = await RemoteBoard.submit(entry); this.rank = r.rank || 0; try { localStorage.removeItem(PENDING_KEY); } catch (e) {} }
    catch (e) { try { localStorage.setItem(PENDING_KEY, JSON.stringify(entry)); } catch (e2) {} }   // retry next time the board opens
  },
  async flush() {
    let p = null; try { p = JSON.parse(localStorage.getItem(PENDING_KEY) || 'null'); } catch (e) {}
    if (!p) return;
    try { const r = await RemoteBoard.submit(p); this.rank = r.rank || this.rank; localStorage.removeItem(PENDING_KEY); } catch (e) {}
  },
};

// ── Share card: renders the report card to a PNG and opens the share dialog ──
const Share = {
  render(d) {
    const [c, g] = makeCanvas(W, H);
    drawBackdrop(g, 'fest', 40, 0.4);
    Font.draw(g, 'I SURVIVED THE SEMESTER AT IITH!', W / 2, 10, '#fff3c4', { align: 'center', shadow: C.ink });
    drawReportCard(g, 10, 26, d);
    Font.draw(g, 'CAN YOU BEAT MY CGPA? PLAY IITH QUEST', W / 2, 148, '#9fe3f0', { align: 'center', shadow: C.ink });
    const host = /^https?:$/.test(location.protocol) && !/claude|localhost/.test(location.host) ? location.host + (location.pathname.length > 1 ? location.pathname : '') : '';
    if (host) Font.draw(g, host, W / 2, 162, '#f2c14e', { align: 'center', shadow: C.ink });
    const [out, og] = makeCanvas(W * 4, H * 4); og.drawImage(c, 0, 0, W * 4, H * 4);
    return out;
  },
  open(d) {
    const text = 'I graduated from IITH Quest with a CGPA of ' + d.cgpa.toFixed(2) + ' and a ' + d.offer.title.toLowerCase() + '. Can you beat it?';
    Game.showShare(Share.render(d), text);
  },
};

// ─────────────────────────────────────────────────────────────────────────────
// 11-main.js — boot, fixed 60Hz loop, scene switching, screen layout and the
// two DOM dialogs (name entry, share card).
// ─────────────────────────────────────────────────────────────────────────────
const Game = (() => {
  const STEP = 1000 / 60;
  let canvas, ctx, scene = null, next = null, fade = 1, fadeDir = -1, modal = false, last = 0, acc = 0, auto = true;
  const $ = id => document.getElementById(id);

  function go(s) { next = s; fadeDir = 1; }
  function tick() {
    if (modal) { Input.endTick(); return; }
    if (fadeDir === 1) { fade += 0.125; if (fade >= 1) { fade = 1; scene = next; next = null; fadeDir = -1; } }
    else { if (fadeDir === -1) { fade -= 0.125; if (fade <= 0) { fade = 0; fadeDir = 0; } } if (scene) scene.update(); }
    Input.endTick();
  }
  function render() {
    if (scene) scene.draw(ctx);
    if (fade > 0) { ctx.fillStyle = 'rgba(11,10,18,' + (Math.ceil(fade * 4) / 4) + ')'; ctx.fillRect(0, 0, W, H); }
  }
  function frame(now) {
    requestAnimationFrame(frame);
    if (!auto) return;
    acc += Math.min(100, now - last); last = now;
    Input.pollGamepad();
    let n = 0; while (acc >= STEP && n < 5) { tick(); acc -= STEP; n++; }
    if (n) render();
  }

  // Fit the 320x180 canvas to the window at a whole number of device pixels.
  function layout() {
    const touch = document.body.classList.contains('touch'), vw = window.innerWidth, vh = window.innerHeight, portrait = vh > vw;
    let aw = vw - 40, ah = vh - 76;
    if (touch) { if (portrait) { aw = vw - 12; ah = vh * 0.48; } else { aw = vw; ah = vh; } }
    const dpr = window.devicePixelRatio || 1;
    let s = Math.max(0.5, Math.min(aw / W, ah / H));
    if (!touch && s * dpr >= 1) s = Math.floor(s * dpr) / dpr;   // phones: use every pixel (full screen) instead of whole-pixel snapping
    canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  }

  // ── DOM dialogs ──
  function askName(cur, cb) {
    const box = $('nameBox'), inp = $('nameInput');
    const done = () => {
      const v = inp.value.toUpperCase().replace(/[^A-Z0-9 ]/g, '').trim().slice(0, 10);
      box.classList.remove('open'); modal = false; inp.blur(); cb(v);
    };
    inp.value = cur || ''; box.classList.add('open'); modal = true;
    $('nameOk').onclick = done; inp.onkeydown = e => { if (e.key === 'Enter') done(); };
    try { inp.focus(); } catch (e) {}
  }
  function showShare(cnv, text) {
    const box = $('shareBox'), img = $('shareImg'), msg = $('shareMsg');
    let url = ''; try { url = cnv.toDataURL('image/png'); } catch (e) {}
    img.src = url; msg.textContent = 'Long-press or right-click the card to save it.';
    box.classList.add('open'); modal = true;
    // Inside an embedded preview frame, downloads and the share sheet are blocked: offer only what works there.
    const framed = window.self !== window.top;
    $('shareBtn').style.display = navigator.share && !framed ? '' : 'none'; $('saveBtn').style.display = framed ? 'none' : '';
    $('shareBtn').onclick = () => {
      cnv.toBlob(async blob => {
        try {
          const file = new File([blob], 'iith-quest-report-card.png', { type: 'image/png' });
          const page = /^https?:$/.test(location.protocol) ? location.href : undefined;
          if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], text, url: page });
          else await navigator.share({ text, url: page });
        } catch (e) { msg.textContent = 'Sharing is not available here. Save the image instead.'; }
      });
    };
    $('saveBtn').onclick = () => {
      try { const a = document.createElement('a'); a.href = url; a.download = 'iith-quest-report-card.png'; document.body.appendChild(a); a.click(); a.remove(); }
      catch (e) { msg.textContent = 'Could not download here. Long-press the image to save it.'; }
    };
    $('copyBtn').onclick = () => {
      const p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject();
      p.then(() => { msg.textContent = 'Caption copied!'; }).catch(() => { msg.textContent = text; });
    };
    $('shareClose').onclick = () => { box.classList.remove('open'); modal = false; };
  }

  // Desktop hint line under the screen, built from the current key bindings
  function updateHint() {
    const el = $('hint'); if (!el || !Input.bindings) return;
    const k = Input.bindings, n = Input.keyName, two = a => k[a][1] ? n(k[a][0]) + ' / ' + n(k[a][1]) : n(k[a][0]);
    el.textContent = n(k.left[0]) + ' ' + n(k.right[0]) + ' move · ' + two('jump') + ' jump · ' + two('dash') + ' dash · ' + two('pause') + ' pause · Options › Keyboard controls to change';
  }
  // Full screen on phones: requested on the first touch (Android/Chrome) and via the ⛶ button.
  // iPhone Safari has no page full screen; there, "Add to Home Screen" opens the game full screen (manifest).
  const fsEl = document.documentElement;
  const canFs = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen) && window.self === window.top;
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  function enterFs() {
    if (!canFs || isFs()) return;
    try { const p = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
  function toggleFs() { if (isFs()) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} } else enterFs(); }
  function init() {
    canvas = $('game'); ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = false;
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
    Save.load(); Input.init(canvas); updateHint(); layout();
    window.addEventListener('resize', layout); window.addEventListener('orientationchange', () => setTimeout(layout, 200));
    document.addEventListener('touchstart', () => setTimeout(layout, 0), { once: true });
    document.body.classList.toggle('can-fs', canFs);
    document.addEventListener('touchend', e => { if (e.target.id !== 'fsBtn' && !e.target.closest('.modal')) enterFs(); }, { once: true });
    $('fsBtn').addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); toggleFs(); });
    $('fsBtn').addEventListener('click', toggleFs);
    const onFs = () => { document.body.classList.toggle('is-fs', isFs()); setTimeout(layout, 120); };
    document.addEventListener('fullscreenchange', onFs); document.addEventListener('webkitfullscreenchange', onFs);
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('contextmenu', e => { if (e.target === canvas) e.preventDefault(); });
    scene = TitleScene();
    last = performance.now(); requestAnimationFrame(frame);
  }

  // Debug / test handle (used by tools/test.js). Harmless in production.
  const api = { go, updateHint, askName, showShare, tick, render, layout, get scene() { return scene; }, set auto(v) { auto = v; }, init };
  window.IITHQuest = { Game: api, Save, Input, Sound, Leaderboard, LEVELS, buildLevel, PlayScene, BossScene, ResultScene, EndingScene, TitleScene, ControlsScene, scoreRun, MINIGAMES, TUNE, moveBody, tileAt, IntroScene, CharScene, LevelSelectScene, OptionsScene, HelpScene, BoardScene, Share, reportData };
  return api;
})();

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', Game.init); else Game.init();

</script>
